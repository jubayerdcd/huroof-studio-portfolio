        }

        .back-to-works:hover {

            background: #dfbc55;
        }

        @media (max-width: 1024px) {
            .case-study-wrapper {
                padding-top: 76px;

        @media (max-width: 600px) {

            color: #fff;

            font-weight: 700;
            margin-bottom: 24px;

        }

        .presentation-text-module p {
            font-size: 1.1rem;
            margin-bottom: 20px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.8);
        }

        .presentation-text-module span {
            color: rgba(255, 255, 255, 0.8) !important;
        }

        @media (max-width: 600px) {
            .presentation-text-module {
                padding: 60px 24px;
            }

            .presentation-text-module h2 {
                font-size: 1.5rem;
            }

                font-size: 1rem;
            }
        }

        .image-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            width: 100%;
            gap: 0;
        }

        .image-grid-2 img {
            width: 100%;
            height: auto;
            display: block;
        }

        .video-container {
            position: relative;
            width: 100%;

        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

    <!-- Minimal JS to handle mobile menu toggle -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Mobile Menu Toggle
            const menuBtn = document.querySelector('.mobile-menu-btn');
            const menuOverlay = document.getElementById('mobileMenuOverlay');
            const menuCloseBtn = document.getElementById('menuCloseBtn');

            if (menuBtn) {
                menuBtn.addEventListener('click', () => {
                    menuOverlay.classList.add('active');
                    document.body.style.overflow = 'hidden';
                });
            }

            if (menuCloseBtn) {
                menuCloseBtn.addEventListener('click', () => {
                    menuOverlay.classList.remove('active');
                    document.body.style.overflow = '';
                });
            }
        });
    </script>
